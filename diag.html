<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Token 開銷診斷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
     background:#0a0f1e;color:#e2e8f0;padding:24px 16px;line-height:1.6}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.sub{font-size:13px;color:#334155;margin-bottom:20px}
.card{background:#0d1626;border:1px solid #1e293b;border-radius:16px;padding:18px;margin-bottom:14px}
input{width:100%;background:#0a0f1e;border:1.5px solid #1e293b;border-radius:11px;
      padding:13px;color:#e2e8f0;font-size:14px;font-family:monospace;outline:none}
input:focus{border-color:#2563eb}
button{width:100%;padding:15px;background:#2563eb;border:none;border-radius:13px;color:#fff;
       font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
button:disabled{background:#1e293b;color:#334155}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;color:#334155;font-weight:800;letter-spacing:.6px;
   padding:6px 8px;border-bottom:1px solid #1e293b}
td{padding:10px 8px;border-bottom:1px solid #131b2e;color:#94a3b8}
td.n{text-align:right;font-family:ui-monospace,Menlo,monospace;color:#e2e8f0;font-weight:700}
.big{font-size:16px;color:#60a5fa}
.warn{color:#f87171}
.ok{color:#4ade80}
#verdict{font-size:14px;line-height:1.8;margin-top:14px;padding:14px;
         background:#0a0f1e;border-radius:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <h1>Token 開銷診斷</h1>
  <div class="sub">分離「prompt 長度」與「瀏覽器環境」兩個變因</div>

  <div class="card">
    <input id="key" type="password" placeholder="sk-ant-api03-...">
    <button id="go" onclick="run()">開始診斷 →</button>
  </div>

  <div id="out"></div>
</div>

<script>
const MODEL='claude-haiku-4-5-20251001';

// 測 A：與 curl 完全相同的最小請求（curl 實測 = 8 tokens）
const A='hi';

// 測 B：cost.html 用的查單字 prompt，逐字取自 index.html
const B=`你是專業英語詞典。針對英文單字「eloquent」，以 JSON 格式回答（只輸出純 JSON，不要加 markdown 或其他文字）：
{"translation":"精準繁體中文翻譯，多個意思用 / 分隔","cefr":"A1/A2/B1/B2/C1/C2 其中一個","pos":"詞性英文如 noun verb adjective","tip":"如何在英語對話中自然使用（繁體中文，1句）","colloc":"最常見的英文搭配短語（英文，1個）"}`;

async function send(prompt,useHeader){
  const h={'Content-Type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01'};
  if(useHeader) h['anthropic-dangerous-direct-browser-access']='true';
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:h,
    body:JSON.stringify({model:MODEL,max_tokens:10,messages:[{role:'user',content:prompt}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${r.status}`);}
  return (await r.json()).usage;
}

let KEY='';
async function run(){
  KEY=document.getElementById('key').value.trim();
  if(!KEY.startsWith('sk-ant-')){alert('API Key 格式不正確');return;}
  const btn=document.getElementById('go');
  btn.disabled=true;btn.textContent='診斷中...';
  document.getElementById('out').innerHTML='';

  const cases=[
    ['A. "hi"（含 browser 標頭）',      A, true],
    ['B. "hi"（不含 browser 標頭）',    A, false],
    ['C. 查單字 prompt（含標頭）',      B, true],
  ];

  let rows='',vals={};
  for(const [label,prompt,hdr] of cases){
    try{
      const u=await send(prompt,hdr);
      vals[label[0]]=u.input_tokens;
      rows+=`<tr><td>${label}</td><td class="n big">${u.input_tokens}</td></tr>`;
    }catch(e){
      rows+=`<tr><td>${label}</td><td class="n warn" style="font-size:12px">${e.message}</td></tr>`;
    }
  }

  let v='';
  if(vals.A!==undefined){
    if(vals.A<100){
      v=`<span class="ok">測 A 只有 ${vals.A} tokens</span>，與 curl 一致。`
       +`代表瀏覽器環境本身沒有額外開銷。<br><br>`
       +(vals.C!==undefined
          ? (vals.C>2000
             ? `但測 C 是 <span class="warn">${vals.C} tokens</span>，遠超過 prompt 實際長度 —— 開銷來自 prompt 內容或請求構造，需進一步檢查。`
             : `測 C 是 <span class="ok">${vals.C} tokens</span>，屬合理範圍。<br><br><b>結論：先前 cost.html 量到的 4,300 是異常值，需重跑量測。</b>`)
          : '');
    }else{
      v=`<span class="warn">測 A 有 ${vals.A} tokens</span>，但同樣內容用 curl 只有 8。`
       +`確認開銷來自瀏覽器路徑，與 prompt 長度無關。`;
    }
  }

  document.getElementById('out').innerHTML=`
  <div class="card">
    <table><tr><th>測試</th><th style="text-align:right">INPUT TOKENS</th></tr>${rows}</table>
    ${v?`<div id="verdict">${v}</div>`:''}
  </div>`;

  btn.disabled=false;btn.textContent='重新診斷 →';
}
</script>
</body>
</html>
